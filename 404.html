<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · The Marketing Partner</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/TMP/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Shrikhand&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000; --ink: #f5f5f7; --ink-2: #a1a1a6; --blue: #0071e3; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
      background: radial-gradient(60% 50% at 50% 40%, #10141c, var(--bg) 70%); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .code {
      margin: 0; font-family: "Shrikhand", Georgia, serif; font-size: clamp(110px, 28vw, 220px); line-height: 1.05; padding: 0 .08em .08em;
      background: linear-gradient(180deg, #fff 0%, #eef2f8 16%, #a7afbd 34%, #3a3f49 49%, #c4ccd8 57%, #fff 68%, #9aa3b1 84%, #e9edf3 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float { 50% { transform: translateY(-10px); } }
    h1 { margin: 8px 0 10px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -.03em; }
    p { margin: 0 0 28px; color: var(--ink-2); font-size: 17px; }
    a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 980px; background: var(--blue); color: #fff; text-decoration: none; font-weight: 600; }
    a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .tag { margin-top: 40px; font-size: 13px; color: var(--ink-2); }
    @media (prefers-reduced-motion: reduce) { .code { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page floated away.</h1>
    <p>The link may be old, or the page may have moved.</p>
    <a class="btn" href="/TMP/">Back to The Marketing Partner</a>
    <p class="tag">#4SAMMY · Please check on those around you.</p>
  </main>
</body>
</html>
